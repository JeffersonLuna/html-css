<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>
    <h1>Exemplo de Formulários</h1>
    <form action="cadastro.php">
        <p>
            <label for="iano">Que ano você nasceu?</label>
            <input type="number" name="num" id="inum" oninput="calcIdade()">
        </p>
        <p>
            <label for="res">Sua idade é:</label>
            <output id="res">0</output>
        </p>
    </form>
    <script>
        function calcIdade() {
            let atual = new Date().getFullYear()
            res.innerHTML = Number(atual) - Number(inum.value)
        }
    </script>
</body>
</html>
